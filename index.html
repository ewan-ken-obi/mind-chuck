<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141619">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mind Palace">
<title>Obi-Wan's Mind Palace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23141619%22/><path d=%22M9 16.5l4.5 4.5L23 11%22 stroke=%22%236fcf97%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- colours: dark (default, from the Claude Design mockup) ---------- */
:root{
  --bg:#101113; --panel:#16181b; --bar:#141619; --raised:#1a1c1f; --card:#1b1e22;
  --line:#2a2e34; --line2:#343941; --hover:rgba(255,255,255,.06); --rule:#3b4149; --soft:rgba(255,255,255,.035); --focus:#1f2b24;
  --ink:#eef0f1; --ink2:#c6cbd1; --ink3:#a3aab2; --ink4:#7d848c;
  --accent:#6fcf97; --accent-ink:#0f1113; --over:#f2777a;
  --shadow:0 18px 48px rgba(0,0,0,.45);
  --f:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme="light"]{
  --bg:#eef0f2; --panel:#ffffff; --bar:#f7f8f9; --raised:#f2f3f5; --card:#ffffff;
  --line:#dde1e5; --line2:#cdd2d8; --hover:rgba(0,0,0,.045); --rule:#c5cad1; --soft:#f0f2f4; --focus:#e7f5ec;
  --ink:#15171a; --ink2:#3a3f45; --ink3:#565c63; --ink4:#80868d;
  --accent:#1e8e4e; --accent-ink:#ffffff; --over:#c9302c;
  --shadow:0 12px 36px rgba(20,24,30,.10);
}
*{box-sizing:border-box}
html,body{margin:0;background:#313f2c;color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
button,input{font-family:var(--f)}
[contenteditable]{outline:none;border-radius:3px;-webkit-user-modify:read-write-plaintext-only}
[contenteditable]:focus{background:var(--focus);box-shadow:0 0 0 1px var(--accent)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--ink4);pointer-events:none}
::selection{background:var(--accent);color:var(--accent-ink)}
input::placeholder{color:var(--ink4)}
a{color:var(--accent)}

/* ---------- frame ---------- */
.shell{min-height:100vh;padding:12px;display:flex;justify-content:center}
.frame{width:100%;max-width:1600px;border:1px solid var(--line);border-radius:12px;overflow:clip;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:calc(100vh - 24px)}
.top{display:flex;align-items:center;gap:8px;background:var(--bar);padding:13px 16px;border-bottom:1px solid var(--line)}
.brand{font:600 15px/1 var(--f);letter-spacing:-.01em;white-space:nowrap}
.crumb{font:600 13px/1 var(--f);color:var(--accent);padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.spacer{flex:1}
.stat{font:500 12.5px/1 var(--f);color:var(--ink3);white-space:nowrap}
.tbtn{border:1px solid var(--line);background:transparent;color:var(--ink3);font:500 11.5px/1 var(--f);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.mob-only{display:none}
.hchk{display:flex;align-items:center;justify-content:center;padding:0!important;border-left:0!important}
.eyebtn{border:0;background:transparent;color:var(--ink4);cursor:pointer;padding:2px;display:flex;border-radius:4px}
.eyebtn:hover{color:var(--ink);background:var(--hover)}
.eyebtn.on{color:var(--accent)}
.eyebtn:disabled{opacity:.35;cursor:default}
.tbtn.on{border-color:var(--accent);color:var(--accent)}
.tbtn:hover{color:var(--ink);border-color:var(--line2)}

.tabs{display:flex;align-items:flex-end;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:15px 2px 13px;margin-right:24px;margin-bottom:-1px;cursor:pointer;border-bottom:2px solid transparent;font:500 14px/1 var(--f);letter-spacing:-.005em;color:var(--ink3);white-space:nowrap;user-select:none}
.tab:hover{color:var(--ink2)}
.tab.on{border-bottom-color:var(--accent);font-weight:600;color:var(--ink)}
.tab.add{color:var(--ink4);margin-right:0}
.tab[draggable=true]{cursor:grab}
.tab[contenteditable=true],.tab[contenteditable=plaintext-only]{cursor:text;padding-left:4px;padding-right:4px}
.tab.dropping{box-shadow:inset 2px 0 0 var(--accent)}
.view{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- Mind Chuck task table ---------- */
.mind{flex:1;display:flex;flex-direction:column}
.thead{display:flex;background:var(--bar);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:3}
.th{padding:8px 10px;font:600 12.5px/1 var(--f);color:var(--ink);border-left:1px solid var(--soft)}
.w-grip{width:26px;flex:none}.w-chk{width:22px;flex:none}
.w-main{flex:1;min-width:0}
.w-status{width:132px;flex:none}.w-project{width:100px;flex:none}.w-who{width:96px;flex:none}.w-date{width:84px;flex:none}.w-x{width:28px;flex:none}
.thead .w-grip,.thead .w-chk,.thead .w-x{border-left:0;padding:0}
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--rule);background:var(--panel)}
.mind>.row:hover{background:var(--hover)}
.row.over{box-shadow:inset 3px 0 0 var(--accent)}
.row.dropping{box-shadow:inset 0 2px 0 var(--accent)}
.grip{padding:13px 0 0 8px;opacity:.35;font:400 12px/1 var(--f);color:var(--ink4);cursor:grab;user-select:none}
.row:hover .grip{opacity:1}
.chkcell{display:flex;align-items:flex-start;padding-top:12px}
.chk{width:17px;height:17px;flex:none;border-radius:4px;border:1.5px solid var(--accent);background:var(--card);display:flex;align-items:center;justify-content:center;font:600 10px/1 var(--f);color:transparent;cursor:pointer;padding:0}
.chk:focus-visible{outline:none;box-shadow:0 0 0 2px var(--accent)}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.main{padding:10px 10px 11px;border-left:1px solid var(--soft)}
.ttext{font:500 15.5px/1.45 var(--f);color:var(--ink);word-break:break-word}
.row.done .ttext{color:var(--ink4);text-decoration:line-through}
.tnote{font:400 13px/1.5 var(--f);color:var(--ink3);margin-top:1px;white-space:pre-wrap;word-break:break-word}
.tnote:empty{display:none}
.row:focus-within:not(:has(.chk:focus)) .tnote:empty{display:block}
.meta{padding:11px 10px;border-left:1px solid var(--soft);font:500 14px/1.4 var(--f);letter-spacing:.03em;color:var(--ink2);word-break:break-word}
.meta.status.set{color:var(--ink2)}
.row.done .meta,.row.done .meta.status,.row.done .tnote{color:var(--ink4)}
.row.done .meta.status select{color:var(--ink4)}
.meta.who{color:var(--ink2)}
.meta.date.over{color:inherit}
.msp{display:none}
.meta.status{padding:0}
.row .meta.status select{height:auto}
.meta.status select,select.cin-meta{appearance:none;-webkit-appearance:none;width:100%;height:100%;border:0;border-radius:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;padding:10px;cursor:pointer;outline:none}
.meta.status select:focus,select.cin-meta:focus{background:var(--focus)}
.meta.status.blank select{color:transparent}
.row:hover .meta.status.blank select,.row:focus-within .meta.status.blank select{color:var(--ink4)}
select.cin-meta.blank{color:var(--ink4)}
select.cin-meta.w-status{width:132px;height:auto;font:500 13px/1.4 var(--f);color:var(--ink2);border-left:1px solid var(--soft)}
select.cin-meta.w-status.blank{color:var(--ink4)}
option{background:var(--panel);color:var(--ink)}
.x{order:10;border:0;background:transparent;color:var(--ink4);cursor:pointer;font:400 15px/1 var(--f);opacity:0;padding:8px 0 0}
.row .meta:empty::before{content:none}
.row:focus-within .meta:empty::before{content:attr(data-ph)}
.row:hover .x,.x:focus-visible{opacity:1}
.x:hover{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--raised);border:1px solid var(--line2);color:var(--ink);font:500 13px/1 var(--f);padding:10px 12px 10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:60}
.toast button{border:0;background:transparent;color:var(--accent);font:600 13px/1 var(--f);cursor:pointer;padding:4px 6px}
.toast .k{color:var(--ink4);font-weight:500}
.agroup{padding:12px 12px 7px;font:600 12px/1 var(--f);color:var(--ink3);letter-spacing:.04em;background:var(--bar);border-bottom:1px solid var(--line)}
.empty{padding:26px 16px;font:500 12.5px/1.6 var(--f);color:var(--ink4);border-bottom:1px solid var(--line)}

.cap{flex:1;min-height:180px;cursor:text;display:flex;flex-direction:column;border-top:1px solid var(--line2);background:var(--panel)}
.caprow{display:flex;align-items:stretch}
.capmain{display:flex;flex-direction:column;border-left:1px solid var(--soft)}
.capmain input{border:0;background:transparent;outline:none;color:var(--ink)}
.cin-task{font:400 15.5px/1.45 var(--f);padding:8px 10px 2px}
.cin-note{font:400 12.5px/1.5 var(--f)!important;color:var(--ink3)!important;padding:0 10px 9px}
.cin-meta{padding:10px;border:0;border-left:1px solid var(--soft);background:transparent;font:500 13px/1.4 var(--f);color:var(--ink2);outline:none;min-width:0}
.cap input:focus{background:var(--focus)}
.ghostbox{width:15px;height:15px;border-radius:4px;border:1px dashed var(--line2)}
.capact{display:flex;align-items:center;gap:12px;padding:12px 10px 14px 58px}
.primary{background:var(--accent);color:var(--accent-ink);font:600 14px/1 var(--f);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;white-space:nowrap}
.capbtn{flex:none;width:48px;display:flex;justify-content:center;padding-top:7px}
.chuckbtn{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);border:1px solid var(--line2);font:600 11px/1 var(--f);border-radius:7px;padding:0;cursor:pointer;white-space:nowrap}
.chuckbtn:hover{border-color:var(--ink4)}
.chuckbtn:active,.chuckbtn.pressed{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{font:500 12.5px/1.6 var(--f);color:var(--ink3)}

/* ---------- project pages ---------- */
.subbar{display:flex;align-items:center;padding:7px 10px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;gap:3px}
.subbar::-webkit-scrollbar{display:none}
.pill{padding:7px 13px;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:transparent;font:500 13.5px/1 var(--f);color:var(--ink2);white-space:nowrap}
.pill.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chipbtn{font:500 11.5px/1 var(--f);color:var(--ink2);border:1px solid var(--line2);background:var(--raised);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;margin-left:6px}
.chipbtn.quiet{color:var(--ink3);border-color:var(--line);background:transparent}

.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 12px 6px}
.kcol{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden}
.kcol.dz{background:var(--focus);box-shadow:inset 0 0 0 1px var(--accent)}
.khead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--raised);border-bottom:1px solid var(--line);font:600 13px/1 var(--f);color:var(--ink3);letter-spacing:-.005em}
.khead.lead{color:var(--ink)}
.khead .n{font-weight:500;font-size:12px}
.kbody{padding:9px;display:flex;flex-direction:column;gap:7px;min-height:230px}
.kcard{position:relative;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 11px 10px;cursor:grab;box-shadow:inset 3px 0 0 var(--line2)}
.kcard.lead{box-shadow:inset 3px 0 0 var(--accent)}
.ktext{font:400 13.5px/1.5 var(--f);color:var(--ink);padding-right:30px;word-break:break-word}
.kwho{font:500 10px/1 var(--f);color:var(--ink3);margin-top:7px;letter-spacing:.03em}
.kwho span{padding:1px 2px}
.ktools{position:absolute;top:6px;right:6px;display:flex;gap:2px;opacity:0}
.kcard:hover .ktools{opacity:1}
.ktools button{border:0;background:transparent;color:var(--ink4);cursor:pointer;font:500 13px/1 var(--f);padding:2px 4px;border-radius:4px}
.ktools button:hover{color:var(--ink);background:var(--hover)}
.kadd{border:1px dashed var(--line2);background:transparent;border-radius:8px;color:var(--ink3);font:500 11.5px/1 var(--f);letter-spacing:.04em;padding:8px 10px;cursor:pointer;text-align:left}

.pad{padding:14px 12px 6px}
.box{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden}
.shead{display:flex;align-items:center;background:var(--bar);border-bottom:1px solid var(--line)}
.shead div{padding:6px 9px;font:600 12.5px/1 var(--f);color:var(--ink3)}
.srow{display:flex;align-items:flex-start;border-bottom:1px solid var(--line)}
.srow:hover{background:var(--hover)}
.stext{flex:1;min-width:0;padding:8px 10px;font:400 15px/1.5 var(--f);color:var(--ink);word-break:break-word}
.sstat{width:140px;flex:none;padding:10px;font:500 13px/1.4 var(--f);color:var(--ink2);letter-spacing:.03em;border-left:1px solid var(--line);align-self:stretch}
.shead .sstat{padding:6px 9px;font:600 12.5px/1 var(--f);color:var(--ink3);letter-spacing:0}
.sadd{padding:10px 9px;font:500 11.5px/1 var(--f);color:var(--ink3);letter-spacing:.04em;cursor:pointer;min-height:90px}

.sbhead{display:flex;align-items:center;gap:8px;background:var(--bar);border-bottom:1px solid var(--line);padding:8px 10px}
.sbhead .t{font:600 13px/1 var(--f)}.sbhead .n{font:500 12px/1 var(--f);color:var(--ink3)}
.sbchip{font:500 11.5px/1 var(--f);color:var(--ink2);border:1px solid var(--line2);background:var(--raised);border-radius:999px;padding:6px 11px;cursor:pointer}
.sbchip.on{border-color:var(--accent);color:var(--accent)}
.sb{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.sb:hover{background:var(--hover)}
.sb.h{background:var(--bar)}.sb.h:hover{background:var(--bar)}
.sb.h>div{font:600 12.5px/1 var(--f);color:var(--ink);padding:8px 10px;border-left:1px solid var(--line)}
.sb.h>div:first-child{border-left:0}
.sbc{padding:10px;border-left:1px solid var(--line);font:500 13px/1.4 var(--f);color:var(--ink2);word-break:break-word}
.sbc:first-child{border-left:0}
.sb-num{width:64px;flex:none;color:var(--ink3)}
.sb-main{flex:1;min-width:0}
.sb-title{font:500 15px/1.5 var(--f);color:var(--ink)}
.sb-note{font:400 12.5px/1.5 var(--f);color:var(--ink3);white-space:pre-wrap}
.sb-note:empty{display:none}.sb:focus-within .sb-note:empty{display:block}
.sb-bic{width:140px;flex:none}
.sb-st{width:180px;flex:none;padding:0}
.sb-st select{appearance:none;-webkit-appearance:none;width:100%;border:0;background:transparent;color:inherit;font:inherit;padding:10px;cursor:pointer;outline:none}
.sb-st select:focus{background:var(--focus)}
.sb-since{width:90px;flex:none}
.sb-days{width:60px;flex:none;text-align:right;color:var(--ink3)}
.sb-x{order:10;width:28px;flex:none;border:0;background:transparent;color:var(--ink4);cursor:pointer;font:400 15px/1 var(--f);opacity:0;padding:10px 0 0}
.sb:hover .sb-x{opacity:1}.sb-x:hover{color:var(--ink)}
.sb.ours{box-shadow:inset 3px 0 0 var(--accent)}.sb.ours .sb-bic{color:var(--accent)}
.sb .ok{color:var(--accent)}.sb .back{color:var(--over)}.sb-days.late{color:var(--over)}
.sb.closed .sb-title,.sb.closed .sbc{color:var(--ink4)}
.sbadd{padding:12px 10px;font:500 12px/1 var(--f);color:var(--ink3);cursor:pointer;letter-spacing:.04em}
.nbhead{display:flex;align-items:center;gap:9px;background:var(--bar);border-bottom:1px solid var(--line);padding:6px 9px}
.nbhead .lbl{font:600 12.5px/1 var(--f);color:var(--ink3)}
.newbtn{border:1px solid var(--line2);background:var(--accent);color:var(--accent-ink);font:600 12.5px/1 var(--f);border-radius:999px;padding:6px 13px;cursor:pointer}
.entry{display:flex;border-bottom:1px solid var(--line)}
.edate{width:116px;flex:none;padding:13px 12px 12px 10px;font:500 12.5px/1.5 var(--f);color:var(--ink3);letter-spacing:.04em;border-right:1px solid var(--line)}
.ebody{flex:1;min-width:0;padding:10px 18px 14px;font:400 15px/1.7 var(--f);color:var(--ink);white-space:pre-wrap;word-break:break-word;cursor:text}
.entry.first .ebody{min-height:200px}
.tail{display:flex;min-height:360px;cursor:text}
.tail .edate{border-right:1px solid var(--line)}
.tail .msg{padding:10px 18px;font:400 13.5px/1.7 var(--f);color:var(--ink3)}
.nbwrap{padding:14px 12px 18px}

/* ---------- footer ---------- */
.foot{display:flex;align-items:center;border-top:1px solid var(--line2);background:var(--raised)}
.fc{padding:5px 10px;font:500 11.5px/1 var(--f);color:var(--ink2);letter-spacing:.04em;border-right:1px solid var(--line2);white-space:nowrap}
.fc.r{border-right:0;border-left:1px solid var(--line2)}
.fc.btn{cursor:pointer;background:transparent;border-top:0;border-bottom:0;border-left:0}
.fc.btn:hover{color:var(--ink)}

/* ---------- settings ---------- */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px;z-index:50}
.dlg{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.dlg h2{margin:0 0 4px;font:600 15px/1.3 var(--f)}
.dlg p{margin:0 0 14px;font:400 12.5px/1.55 var(--f);color:var(--ink3)}
.dlg label{display:block;font:600 11.5px/1 var(--f);color:var(--ink2);margin:12px 0 6px}
.dlg input{width:100%;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 10px;font:400 13px/1.3 var(--f);outline:none}
.dlg input:focus{border-color:var(--accent)}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dlg .err{color:var(--over);font:500 12px/1.4 var(--f);margin-top:10px;min-height:1em}

/* ---------- touch devices: tools always visible ---------- */
@media (hover:none){
  .x{opacity:.55}
  .ktools{opacity:.8}
}

/* ---------- phone ---------- */
@media (max-width:720px){
  .shell{padding:0}
  .frame{border:0;border-radius:0;box-shadow:none;min-height:100vh}
  .top{padding:12px 12px;padding-top:max(12px,env(safe-area-inset-top))}
  .stat{display:none}
  .mob-only{display:inline-block}
  .thead{display:none}
  .row{flex-wrap:wrap}
  .row .w-grip{display:none}
  .row .w-chk{width:38px;padding-left:14px;order:0}
  .row .main{order:1;flex:1 1 calc(100% - 38px - 34px);border-left:0;padding:7px 4px 4px}
  .row .x{order:2;width:34px;padding:10px 0 0}
  .row .msp{display:block;order:3;width:38px;flex:none}
  .row .meta{order:4;width:auto;flex:none;border-left:0;padding:0 12px 9px 4px;font-size:11.5px;max-width:100%}
  .row .meta:empty{display:none}
  .row:focus-within:not(:has(.chk:focus)) .meta:empty{display:block}
  .ttext{font-size:15px}
  .cap{flex:none;min-height:0}
  .row .meta.blank{display:none}
  .row:focus-within:not(:has(.chk:focus)) .meta.blank{display:block}
  .meta.status select{padding:0 12px 9px 4px}
  .caprow{flex-wrap:wrap}
  .capbtn{width:38px;padding:7px 0 0 4px}
  .chuckbtn{width:34px;height:34px;font-size:9.5px}
  .capmain{flex:1 1 calc(100% - 38px);min-width:0;border-left:0}
  .cin-task{font-size:15px;padding:9px 8px 2px}
  .cin-meta{flex:1 1 25%;width:auto!important;border-left:0;border-top:1px solid var(--line);font-size:12px;padding:9px 8px}
  .cin-meta+.cin-meta{border-left:1px solid var(--line)}
  .hint{display:none}
  .kgrid{grid-template-columns:1fr}
  .kbody{min-height:0}

<div id="app"></div>
<script>
(function () {

var LS = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

var TABLE = { tasks: 'Tasks', projects: 'Projects', cards: 'Cards', notes: 'Notes', rows: 'Rows', submittals: 'Submittals' };
var KINDS = Object.keys(TABLE);
var COLS = [
  { key: 'open', title: 'Open items' },
  { key: 'solved', title: 'Solved' },
  { key: 'questions', title: 'Questions' }

var POLL_MS = 45000;

function emptyDb() { return { tasks: [], projects: [], cards: [], notes: [], rows: [], submittals: [] }; }

var cfg = LS.get('mc.cfg', { url: '', key: '' });
var ui = Object.assign({ nav: 'mind', sub: {}, archive: false, theme: 'dark',
  draft: { text: '', status: '', project: '', who: '', date: '', note: '' } }, LS.get('mc.ui', {}));
var sync = { state: 'idle', at: null };
var edits = 0, inflight = null, flushing = false, pendingRender = false, dragTask = null, dragCard = null, dragTab = null;
var newCard = null, newRow = null, newSub = null, focusAfter = null;

function saveDb() { LS.set('mc.db', db); }
function saveUi() { LS.set('mc.ui', ui); }
function saveQueue() { LS.set('mc.queue', inflight ? [inflight].concat(queue) : queue); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function byOrder(a, b) { return num(a.order) - num(b.order); }

/* =========================================================
   Data changes -> local copy + queue for the Sheet
   ========================================================= */
function enqueue(op) {
  if (op.action === 'upsert' || op.action === 'remove') {
    var id = op.action === 'upsert' ? op.row.id : op.id;
    queue = queue.filter(function (q) {
      return !((q.action === 'upsert' && q.table === op.table && q.row.id === id));
    });

}
function put(kind, row) {
  var list = db[kind], i = -1;
  for (var j = 0; j < list.length; j++) if (list[j].id === row.id) { i = j; break; }
  if (i < 0) list.push(row); else list[i] = row;
  saveDb();
  enqueue({ action: 'upsert', table: TABLE[kind], row: Object.assign({}, row) });
}
function patch(kind, id, changes) {
  var r = find(kind, id); if (!r) return;

}
function remove(kind, id) {

}
function find(kind, id) {

  return null;
}

/* =========================================================
   Sync with Google Apps Script
   ========================================================= */
function api(op) {
  return fetch(cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ key: cfg.key }, op)) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Save failed'); return j; });
}

  setSync('saving');
  inflight = queue.shift();
  saveQueue();
  api(inflight).then(function () {
    inflight = null; flushing = false; saveQueue();
    sync.at = new Date(); sync.err = '';
    flush();
  }).catch(function (e) {
    queue.unshift(inflight); inflight = null; flushing = false; saveQueue();
    sync.err = e.message;
    setSync(/key/i.test(e.message) ? 'badkey' : /unknown table|missing tab/i.test(e.message) ? 'backend' : 'offline');
    setTimeout(flush, 15000);
  });
}
function normalize(kind, r) {
  var o = {};
  for (var k in r) o[k] = r[k] == null ? '' : String(r[k]);
  if (kind === 'tasks') { o.done = /^true$/i.test(o.done); o.archived = /^true$/i.test(o.archived); }
  o.order = num(o.order);

}
function pull(force) {

  var startEdits = edits;
  return fetch(cfg.url + (cfg.url.indexOf('?') < 0 ? '?' : '&') + 'key=' + encodeURIComponent(cfg.key))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) throw new Error(j.error || 'Load failed');

      var fresh = emptyDb(), total = 0, localTotal = 0;

        fresh[k] = (j[TABLE[k]] || []).map(function (r) { return normalize(k, r); });
        total += fresh[k].length; localTotal += db[k].length;
      });
      if (total === 0 && localTotal > 0) {
        // Brand-new Sheet: send up what this browser already has
        KINDS.forEach(function (k) { db[k].forEach(function (r) { queue.push({ action: 'upsert', table: TABLE[k], row: r }); }); });
        saveQueue(); flush(); return;

      sync.at = new Date(); setSync('idle');

function setSync(s) {

  if (el) el.textContent = syncLabel();
}
function syncLabel() {
  var n = queue.length + (inflight ? 1 : 0);

    case 'saving': return 'Saving…';
    case 'loading': return 'Syncing…';
    case 'offline': return 'Offline' + (n ? ' · ' + n + ' unsaved' : '');

/* =========================================================
   Dates
   ========================================================= */
var DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

// "9/30" -> 9/30/26 (this year), "9/30/27" -> 9/30/27. Ctrl+; in a date field also puts today.
function parseDue(tok) {
  var t = String(tok || '').trim(), l = t.toLowerCase(), d = today();
  if (!t) return '';

  if (m) {

    var x = new Date(y, +m[1] - 1, +m[2]);

    var i = DAYS.indexOf(l.slice(0, 3));
    if (i >= 0) { d.setDate(d.getDate() + ((i - d.getDay() + 7) % 7 || 7)); return md(d); }
  }

}
function dueDate(s) {
  var m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(String(s || '').trim());
  if (!m) return null;
  var t = today(), y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : t.getFullYear();
  var d = new Date(y, +m[1] - 1, +m[2]);
  if (!m[3] && (d - t) > 1000 * 60 * 60 * 24 * 183) d.setFullYear(y - 1);
  return d;
}
function isOver(task) { var d = dueDate(task.date); return !task.done && d && d < today(); }

/* =========================================================

function render(force) {

function topBar(nb) {

    ? edit('div', 'crumb', nb.name, function (v) { if (v) patch('projects', nb.id, { name: v }); }, { ph: 'Project name' })

    crumb,
    h('div', { class: 'spacer' }),
    h('div', { class: 'stat', text: nb ? activeSub(nb) : open.length + ' open · ' + waiting + ' waiting' }),
    nb || ui.archive ? null : h('button', { class: 'tbtn mob-only' + (checkedOnList().length ? ' on' : ''), title: 'Move checked tasks to the Archive',

    h('button', { class: 'tbtn', id: 'syncbtn', title: 'Sync settings', onclick: openSettings, text: syncLabel() }),
    h('button', { class: 'tbtn', title: 'Light / dark', text: ui.theme === 'light' ? 'Dark' : 'Light',
      onclick: function () { ui.theme = ui.theme === 'light' ? 'dark' : 'light'; saveUi(); render(); } })

// Put project `id` just before project `beforeId` (null = at the end)
function moveTab(id, beforeId) {
  var rest = db.projects.slice().sort(byOrder).filter(function (p) { return p.id !== id; });
  var i = beforeId ? rest.findIndex(function (p) { return p.id === beforeId; }) : rest.length;
  var prev = i > 0 ? num(rest[i - 1].order) : (rest.length ? num(rest[0].order) - 1 : 0);
  var next = i < rest.length ? num(rest[i].order) : prev + 2;

function renameTab(el, t) {

}

  return h('div', { class: 'tabs' },
    list.map(function (t) {

/* ---------------- Undo (Ctrl+Z, or the Undo button in the pop-up) ---------------- */

function fromIso(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }

        put('submittals', { id: uid(), project: nb.id, num: d.num, title: v, note: '', bic: 'Us', status: 'Preparing', since: md(today()), order: max + 1 });
      }, { ph: 'Submittal title — Enter to add', spell: true }))) : null,
    h('div', { class: 'sbadd', text: '+ New submittal', onclick: function () {
      var n = all.reduce(function (a, x) { var v = numVal(x.num); return v < 1e9 ? Math.max(a, v) : a; }, 0) + 1;
      newSub = { project: nb.id, num: String(n).padStart(2, '0') };
      focusAfter = '.sbdraft'; render(true);
    } })
  ));
}
function submittalRow(x) {
  var days = subDays(x), closed = subClosed(x);
  var late = !closed && /^(submitted|under review)$/i.test(x.status || '') && days !== null && days >= LATE_DAYS;
  var stamp = function (changes) { changes.since = md(today()); patch('submittals', x.id, changes); };
  var bic = edit('div', 'sbc sb-bic', x.bic, function (v) { stamp({ bic: v }); }, { ph: 'Who' });
  var opts = SUB_STATUSES.slice(); if (x.status && opts.indexOf(x.status) < 0) opts.unshift(x.status);
  var st = h('select', { title: 'Status', onchange: function () { remember('submittals', x.id, 'Status changed'); stamp({ status: st.value }); render(); } },
    h('option', { value: '', text: '—' }), opts.map(function (o) { return h('option', { value: o, text: o }); }));
  st.value = x.status || '';
  var stCls = /^approved/i.test(x.status || '') ? ' ok' : /^(revise|rejected)/i.test(x.status || '') ? ' back' : '';
  var sinceEl = edit('div', 'sbc sb-since', x.since, function (v) { patch('submittals', x.id, { since: parseDue(v) }); }, { ph: 'Date' });
  sinceEl.setAttribute('data-date', '');
  return h('div', { class: 'sb' + (subOurs(x) ? ' ours' : '') + (closed ? ' closed' : '') },
    edit('div', 'sbc sb-num', x.num, function (v) { patch('submittals', x.id, { num: v }); }, { ph: '#' }),
    h('div', { class: 'sbc sb-main' },
      edit('div', 'sb-title', x.title, function (v) {
        if (v) patch('submittals', x.id, { title: v });
        else { remember('submittals', x.id, 'Submittal deleted'); remove('submittals', x.id); }
      }, { ph: 'Submittal', spell: true }),
      edit('div', 'sb-note', x.note, function (v) { patch('submittals', x.id, { note: v }); }, { ph: 'Add a note', multi: true, spell: true })),
    h('button', { class: 'sb-x', title: 'Delete', text: '×', onclick: function () { remember('submittals', x.id, 'Submittal deleted'); remove('submittals', x.id); render(); } }),
    bic,
    h('div', { class: 'sbc sb-st' + stCls }, st),
    sinceEl,
    h('div', { class: 'sbc sb-days' + (late ? ' late' : ''), title: late ? 'In review ' + days + ' days' : '', text: closed || days === null ? '—' : String(days) })
  );
}

/* Subsheet (simple two-column list) */
function sheet(nb, sub) {
  var rows = db.rows.filter(function (r) { return r.project === nb.id && r.sub === sub; }).sort(byOrder);
  var drafting = newRow && newRow.project === nb.id && newRow.sub === sub;
  return h('div', { class: 'pad' }, h('div', { class: 'box' },
    h('div', { class: 'shead' }, h('div', { style: 'flex:1', text: sub }), h('div', { class: 'sstat', text: 'Status' })),
    rows.map(function (r) {
      return h('div', { class: 'srow' },
        edit('div', 'stext', r.text, function (v) { if (v) patch('rows', r.id, { text: v }); else remove('rows', r.id); }, { ph: 'Line', spell: true }),
        edit('div', 'sstat', r.status, function (v) { patch('rows', r.id, { status: v }); }, { ph: '' })
      );
    }),
    drafting ? h('div', { class: 'srow' },
      edit('div', 'stext draftrow', '', function (v) {
        newRow = null; if (!v) return;
        var max = db.rows.reduce(function (a, x) { return Math.max(a, num(x.order)); }, 0);
        put('rows', { id: uid(), project: nb.id, sub: sub, text: v, status: '', order: max + 1 });
      }, { ph: 'New line', spell: true }),
      h('div', { class: 'sstat' })) : null,
    h('div', { class: 'sadd', text: '+ New line', onclick: function () {
      newRow = { project: nb.id, sub: sub }; focusAfter = '.draftrow'; render(true);
    } })
  ));
}

/* Notebook (dated entries, newest on top, page never ends) */
function notebook(nb, key) {
  var entries = db.notes.filter(function (n) { return n.project === nb.id && n.sub === key; })
    .sort(function (a, b) { return num(b.order) - num(a.order); });
  var label = longLabel(today());
  function focusTop() { var el = document.querySelector('.entry.first .ebody'); if (el) { el.focus(); placeCaret(el); } }
  return h('div', { class: 'nbwrap' }, h('div', { class: 'box' },
    h('div', { class: 'nbhead' },
      h('div', { class: 'lbl', text: key === 'Meeting notes' ? 'Notebook' : key }),
      h('div', { class: 'spacer' }),
      h('button', { class: 'newbtn', text: 'New entry', onclick: focusTop })
    ),
    h('div', { class: 'entry first' },
      h('div', { class: 'edate', text: label }),
      edit('div', 'ebody', '', function (v) {
        if (!v.trim()) return;
        var max = db.notes.reduce(function (a, x) { return Math.max(a, num(x.order)); }, 0);
        put('notes', { id: uid(), project: nb.id, sub: key, date: label, body: v, order: max + 1 });
      }, { multi: true, spell: true, ph: 'Write here — it saves when you click away.' })
    ),
    entries.map(function (en) {
      return h('div', { class: 'entry' },
        edit('div', 'edate', en.date, function (v) { patch('notes', en.id, { date: v || en.date }); }, { ph: 'Date' }),
        edit('div', 'ebody', en.body, function (v) { if (v.trim()) patch('notes', en.id, { body: v }); else remove('notes', en.id); }, { multi: true, spell: true })
      );
    }),
    h('div', { class: 'tail', onclick: focusTop },
      h('div', { class: 'edate', text: '+' }),
      h('div', { class: 'msg', text: 'keep writing — the page never ends…' })
    )
  ));
}

/* ---------------- Settings ---------------- */
function openSettings() {
  var url = h('input', { value: cfg.url, placeholder: 'https://script.google.com/macros/s/…/exec', autocomplete: 'off', spellcheck: 'false' });
  var key = h('input', { value: cfg.key, placeholder: 'The KEY from your Code.gs', type: 'password', autocomplete: 'off' });
  var err = h('div', { class: 'err' });
  // Only close when the click both starts and ends on the dark background,
  // so drag-selecting text in a field (and releasing outside) doesn't close it.
  var downOnVeil = false;
  var veil = h('div', { class: 'veil',
    onmousedown: function (e) { downOnVeil = e.target === veil; },
    onclick: function (e) { if (e.target === veil && downOnVeil) close(); downOnVeil = false; },
    onkeydown: function (e) { if (e.key === 'Escape') close(); } },
    h('div', { class: 'dlg' },
      h('h2', { text: 'Connect to your Google Sheet' }),
      h('p', { text: 'Paste your Apps Script web app URL and key. They are saved in this browser only — do this once on each device.' }),
      sync.err && sync.state !== 'idle' ? h('p', { style: 'color:var(--over)', text: 'Last error from the Sheet: ' + sync.err + ((queue.length + (inflight ? 1 : 0)) ? '  (' + (queue.length + (inflight ? 1 : 0)) + ' changes waiting)' : '') }) : null,
      h('label', { text: 'Web app URL' }), url,
      h('label', { text: 'Key' }), key,
      err,
      h('div', { class: 'acts' },
        cfg.url ? h('button', { class: 'chipbtn quiet', text: 'Disconnect', onclick: function () { cfg = { url: '', key: '' }; LS.set('mc.cfg', cfg); close(); setSync('local'); } }) : null,
        h('button', { class: 'chipbtn quiet', text: 'Cancel', onclick: close }),
        h('button', { class: 'primary', text: 'Save & sync', onclick: function () {
          var u = url.value.trim(), k = key.value.trim();
          if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) { err.textContent = 'That should be a script.google.com …/exec URL.'; return; }
          err.textContent = 'Checking…';
          fetch(u + '?key=' + encodeURIComponent(k)).then(function (r) { return r.json(); }).then(function (j) {
            if (!j.ok) { err.textContent = j.error || 'Not accepted.'; return; }
            cfg = { url: u, key: k }; LS.set('mc.cfg', cfg);
            close(); pull(true);
          }).catch(function () { err.textContent = 'Could not reach it. Check the URL and that access is set to "Anyone".'; });
        } })
      )
    )
  );
  function close() { veil.remove(); }
  document.body.appendChild(veil);
  (cfg.url ? key : url).focus();
}

/* ---------------- Start ---------------- */
document.addEventListener('keydown', function (e) {
  if (!(e.ctrlKey || e.metaKey) || e.key !== ';') return;
  var el = e.target;
  if (!el || !el.hasAttribute || !el.hasAttribute('data-date')) return;
  e.preventDefault();
  if (el.tagName === 'INPUT') { el.value = md(today()); ui.draft.date = el.value; saveUi(); }
  else { el.textContent = md(today()); placeCaret(el); }
});
/* ---------------- Keyboard navigation in the task list (like Excel) ----------------
   Up/Down = row above/below · Left/Right at the edge of the text = next cell
   Enter = save and go down · Tab / Shift+Tab = next / previous cell
   Space on a checkbox = check · F2 = edit the cell without replacing it · Up from the add row = into the list
   With nothing selected: Down/Up = first/last task, N = new task */
var GRID = ['chk', 'text', 'status', 'project', 'who', 'date'];
function gridRows() { return Array.prototype.slice.call(document.querySelectorAll('.mind .row[data-id]')); }
function gridCell(row, col) { return row ? row.querySelector('[data-col="' + col + '"]') : null; }
// Arriving by keyboard highlights the whole cell (like Excel): typing replaces it, Esc undoes,
// click inside or press F2 to edit without replacing.
function focusCell(el) {
  if (!el) return; el.focus();
  if (el.isContentEditable) { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
}
function wholeSelected(el) {
  var s = getSelection(); if (!s.rangeCount || s.isCollapsed) return false;
  return s.toString() === el.textContent;
}
function caretAt(el, end) {
  var sel = getSelection();
  if (wholeSelected(el)) return true;
  if (!sel.rangeCount || !sel.isCollapsed) return false;
  var r = sel.getRangeAt(0), pre = document.createRange();
  pre.selectNodeContents(el);
  if (end) pre.setStart(r.endContainer, r.endOffset); else pre.setEnd(r.startContainer, r.startOffset);
  return pre.toString().length === 0;
}
document.addEventListener('keydown', function (e) {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  var el = e.target;
  if (!el || !el.getAttribute || ui.nav !== 'mind' || ui.archive) return;
  var rows = gridRows();
  // nothing selected
  if (el === document.body) {
    if (e.key === 'ArrowDown' && rows.length) { e.preventDefault(); focusCell(gridCell(rows[0], 'text')); }
    else if (e.key === 'ArrowUp' && rows.length) { e.preventDefault(); focusCell(gridCell(rows[rows.length - 1], 'text')); }
    else if (e.key === 'n' || e.key === 'N') { var ct = document.querySelector('[data-cap="text"]'); if (ct) { e.preventDefault(); ct.focus(); } }
    return;
  }
  // add row -> up into the list
  var cap = el.getAttribute('data-cap');
  if (cap) {
    if (e.shiftKey) return;
    var CAPROW = ['text', 'status', 'project', 'who', 'date'];
    var capEl = function (k) { return document.querySelector('[data-cap="' + k + '"]'); };
    var jump = function (k) { var x = capEl(k); if (!x) return; e.preventDefault(); e.stopPropagation(); x.focus(); if (x.select) x.select(); };
    var isInput = el.tagName === 'INPUT', len = isInput ? el.value.length : 0;
    var all = isInput && el.selectionStart === 0 && el.selectionEnd === len;
    var atStart = !isInput || all || (el.selectionStart === 0 && el.selectionEnd === 0);
    var atEnd = !isInput || all || el.selectionStart === len;
    var pos = CAPROW.indexOf(cap === 'note' ? 'text' : cap);
    if (e.key === 'ArrowUp') {
      if (cap === 'note') jump('text');
      else if (rows.length) { e.preventDefault(); e.stopPropagation(); focusCell(gridCell(rows[rows.length - 1], cap)); }
    } else if (e.key === 'ArrowDown') {
      if (cap === 'text') jump('note');
      else if (!isInput) { e.preventDefault(); e.stopPropagation(); } // don't flip the status by accident
    } else if (e.key === 'ArrowLeft' && atStart && pos > 0) jump(CAPROW[pos - 1]);
    else if (e.key === 'ArrowRight' && atEnd && pos < CAPROW.length - 1) jump(CAPROW[pos + 1]);
    return;
  }
  var col = el.getAttribute('data-col');
  if (!col) return;
  var ri = rows.indexOf(el.closest('.row')), ci = GRID.indexOf(col), editable = el.isContentEditable;
  function go(r, c) {
    e.preventDefault(); e.stopPropagation();
    if (r >= rows.length) { var a = document.querySelector('[data-cap="' + (GRID[c] === 'chk' ? 'text' : GRID[c]) + '"]'); if (a) a.focus(); return; }
    if (r < 0) return;
    focusCell(gridCell(rows[r], GRID[c]));
  }
  if (e.key === 'F2' && editable) { e.preventDefault(); placeCaret(el); return; }
  switch (e.key) {
    case 'ArrowUp': if (!e.shiftKey) go(ri - 1, ci); break;
    case 'ArrowDown': if (!e.shiftKey) go(ri + 1, ci); break;
    case 'Enter': if (col !== 'chk' && !e.shiftKey) go(ri + 1, ci); break;
    case 'ArrowLeft': if (!e.shiftKey && ci > 0 && (!editable || caretAt(el, false))) go(ri, ci - 1); break;
    case 'ArrowRight': if (!e.shiftKey && ci < GRID.length - 1 && (!editable || caretAt(el, true))) go(ri, ci + 1); break;
    case 'Tab':
      var n = ci + (e.shiftKey ? -1 : 1);
      if (n >= GRID.length) go(ri + 1, 1); else if (n < 0) go(ri - 1, GRID.length - 1); else go(ri, n);
      break;
  }
}, true);
if (!cfg.url) migrateOrder();
render();
if (cfg.url) { flush(); pull(); } else setSync('local');
setInterval(function () { if (!document.hidden) pull(); }, POLL_MS);
document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(); });
window.addEventListener('online', flush);
})();
</script>
